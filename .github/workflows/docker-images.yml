name: Docker images

# Builds and publishes Docker images (generated by Upstream Manager; edit freely).
#   GHCR:       ghcr.io/wizard815/<image>  (uses the run's GITHUB_TOKEN; nothing to set up)
#   Docker Hub: <DOCKERHUB_USERNAME>/<image>  (needs repo secrets DOCKERHUB_USERNAME and
#               DOCKERHUB_TOKEN; skipped until both are set)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:        # builds the images to check them; never pushes
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GHCR

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: allglance-gateway
            context: gateway
            dockerfile: gateway/Dockerfile
          - image: allglance-dayglance-mcp
            context: gateway/container-mcp
            dockerfile: gateway/container-mcp/Dockerfile
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.PUSH == 'true' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/wizard815/${{ matrix.image }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/{1}', env.DOCKERHUB_USERNAME, matrix.image) || '' }}
          # latest = the default branch; vX.Y.Z tags also give X.Y.Z and X.Y; sha-<short> always
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
