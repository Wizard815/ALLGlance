name: CI

# Gateway + dayGLANCE MCP tests, and a compose sanity check. The GLANCE apps and
# vikunja are consumed as prebuilt images, so nothing here builds them.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gateway tests
        working-directory: gateway
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          node --test
      - name: dayGLANCE MCP tests
        working-directory: gateway/container-mcp
        run: |
          npm install --no-audit --no-fund
          node --test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Pinned versions agree (submodule = compose = .env.example)
        run: ./scripts/upstream.sh verify
      - name: Shell scripts parse
        run: bash -n scripts/setup.sh && bash -n scripts/upstream.sh
      - name: Validate docker-compose.yml
        run: |
          touch .env.allglance
          VIKUNJA_SERVICE_SECRET=x DAYGLANCE_SYNC_PASSWORD=x docker compose config -q

  images:
    # Build both AllGLANCE images. This is what would have caught a .dockerignore
    # that excluded the lockfile the Dockerfile copies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the allglance image
        run: |
          touch .env.allglance
          VIKUNJA_SERVICE_SECRET=x DAYGLANCE_SYNC_PASSWORD=x \
            docker compose build allglance
