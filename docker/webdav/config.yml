# WebDAV server for dayGLANCE's built-in "Generic WebDAV" cloud sync. The
# browser apps sync their planner snapshot (dayglance-sync.json) here, and the
# dayglance-mcp service reads/writes the same file from a shared volume, so the
# gateway always sees the live app data with no manual export.
address: 0.0.0.0
port: 6065
directory: /data
permissions: CRUD
users:
  - username: "{env}DAYGLANCE_SYNC_USER"
    password: "{env}DAYGLANCE_SYNC_PASSWORD"
