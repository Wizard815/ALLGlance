# WebDAV server for dayGLANCE/lastGLANCE/lifeGLANCE Cloud Sync and the apps' intents,
# run inside the single `allglance` container. The apps sync their data here; the
# MCP and gateway read and write the same files from the same directory, so the
# gateway always sees live app data with no manual export.
address: 0.0.0.0
port: 6065
directory: /sync
permissions: CRUD
users:
  - username: "{env}DAYGLANCE_SYNC_USER"
    password: "{env}DAYGLANCE_SYNC_PASSWORD"
