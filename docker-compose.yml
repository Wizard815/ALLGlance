# AllGLANCE — combined orchestration for the whole family-stack.
#
# Brings together all four GLANCE apps plus the AllGLANCE gateway on one
# internal network so the gateway can reach each service by its compose
# service name (that is how gateway/src/config.js resolves hostnames).
#
# This is the top-level file the user runs from the repo root:
#   docker compose up --build
#
# Per-app compose files live under apps/<app>/docker-compose.yml and
# services/vikunja; those are the app-specific overrides. This file is the
# *union* that wires them together and adds the gateway.
#
# --- Versions ---
# Image tags match the submodule pins under apps/ and services/ (dayglance
# v5.9.0, lastglance v2.9.0, lifeglance v3.6.0, vikunja v2.7.1). The submodules
# are reference source only; they are not built. When you bump one, bump the
# other and re-run gateway/container-mcp/scripts/vendor-model.mjs (dayglance).
#
# --- Unraid / appdata layout ---
# Map each service's persistent data under ${ALLGLANCE_DATA:-/mnt/user/appdata/allglance-data}/ so it
# survives container recreation. Adjust the host paths to your NAS share.
#
#   vikunja      -> ${ALLGLANCE_DATA:-/mnt/user/appdata/allglance-data}/vikunja/{config,db,files,logs}
#   gateway      -> ${ALLGLANCE_DATA:-/mnt/user/appdata/allglance-data}/gateway (env file + roster cache)
#   dayglance    -> ${ALLGLANCE_DATA:-/mnt/user/appdata/allglance-data}/dayglance (persistent webdata if any)
#   lastglance   -> (localStorage-based; see DESIGN.md §10)
#   lifeglance   -> (localStorage-based; see DESIGN.md §10)
#
# The lastglance and lifeglance apps are browser localStorage SPAs — they have
# no server-side state to persist here, so no host mounts are strictly required
# for them. dayglance keeps its roster in localStorage too; its persistent part
# is only WebDAV/CalDAV sync, which lives wherever those are configured.
#
# --- GLANCEvault (the sync backbone) ---
# GLANCEvault is the optional self-hosted zero-knowledge sync backend the three
# browser apps push their encrypted rows to. It is NOT an MCP and never sees
# plaintext — it relays opaque ciphertext between a household's devices. Set
# GLANCEVAULT_DEVICE_TOKEN in .env.allglance before starting it.
#
# Run with:  docker compose --env-file .env.allglance up --build
# (--env-file is what makes ${...} substitution below see your secrets; the
# gateway's env_file only feeds the container, not compose interpolation.) Data lives in
# a host bind mount owned by uid/gid 99:100 (Unraid nobody:users).

services:
  # --- glance-vault: zero-knowledge sync backend for the browser apps ---
  glance-vault:
    # OPTIONAL and off by default (nothing in this stack needs it): enable with
    #   docker compose --profile vault up -d
    profiles: ["vault"]
    image: ghcr.io/glance-apps/glance-vault:latest
    container_name: allglance-glance-vault
    restart: unless-stopped
    user: "99:100"                 # match the owner of the bind-mounted data dir below
    ports:
      - "8088:8080"
    volumes:
      - ${ALLGLANCE_DATA:-/mnt/user/appdata/allglance-data}/glance-vault:/data   # owned by 99:100 on the host
    environment:
      - GLANCEVAULT_STORAGE_PATH=/data/glancevault.db
      - GLANCEVAULT_PORT=8080
      - GLANCEVAULT_DEVICE_TOKEN=${GLANCEVAULT_DEVICE_TOKEN:-}
      - GLANCEVAULT_AUTH_MODE=${GLANCEVAULT_AUTH_MODE:-shared}
      # List every origin a browser client connects from. The dayglance Electron
      # desktop app sends Origin: app://dayglance; web builds send their public
      # origin. Without these, cross-origin fetch/SSE is blocked.
      - GLANCEVAULT_ALLOWED_ORIGINS=${GLANCEVAULT_ALLOWED_ORIGINS:-}
      - GLANCEVAULT_TRUST_PROXY=${GLANCEVAULT_TRUST_PROXY:-loopback}
    # No healthcheck override: the image has none of wget/curl, but ships its
    # own node-based check against /healthz.

  # --- vikunja: the server-side hub, real DB, real API ---
  vikunja:
    # Pinned to the release the services/vikunja submodule is pinned to.
    # Bump the image tag and the submodule together.
    image: ghcr.io/go-vikunja/vikunja:${VIKUNJA_IMAGE_TAG:-2.8.0}
    container_name: allglance-vikunja
    restart: unless-stopped
    user: "99:100"                 # same owner as every other data dir here (the image default, uid 1000, cannot write them)
    ports:
      - "3457:3456"
    volumes:
      - ${ALLGLANCE_DATA:-/mnt/user/appdata/allglance-data}/vikunja/db:/db
      - ${ALLGLANCE_DATA:-/mnt/user/appdata/allglance-data}/vikunja/files:/app/vikunja/files
      - ${ALLGLANCE_DATA:-/mnt/user/appdata/allglance-data}/vikunja/logs:/app/vikunja/logs
    environment:
      - VIKUNJA_SERVICE_SECRET=${VIKUNJA_SERVICE_SECRET:?set VIKUNJA_SERVICE_SECRET in .env.allglance}
      - VIKUNJA_SERVICE_INTERFACE=:3456
      - VIKUNJA_SERVICE_PUBLICURL=http://localhost:3457
      - VIKUNJA_SERVICE_ENABLECALDAV=true
      - VIKUNJA_SERVICE_ENABLEREGISTRATION=${VIKUNJA_ENABLE_REGISTRATION:-false}
      - VIKUNJA_DATABASE_TYPE=sqlite
      - VIKUNJA_DATABASE_PATH=/db/vikunja.db
      - VIKUNJA_FILES_TYPE=local
      - VIKUNJA_FILES_BASEPATH=/app/vikunja/files
      - VIKUNJA_LOG_STANDARD=stdout
      - VIKUNJA_LOG_LEVEL=INFO
    healthcheck:
      # The image is minimal (no wget/curl); the binary ships its own check.
      test: ["CMD", "/app/vikunja/vikunja", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- dayglance web build ---
  dayglance:
    image: ghcr.io/krelltunez/dayglance:${DAYGLANCE_IMAGE_TAG:-5.11.0}
    container_name: allglance-dayglance
    restart: unless-stopped
    ports:
      - "6767:80"
    # dayglance's roster lives in the browser localStorage (App.jsx users[] +
    # meUserSyncId). The web build has NO MCP — the gateway reads dayglance via
    # the dayglance-mcp process inside the allglance container.
    # (dayGLANCE reads no environment configuration. To show vikunja tasks in it,
    # set Settings -> Integrations -> Task Calendar URL to
    # http://vikunja:3456/dav/projects/<id> with your vikunja user + password;
    # its built-in proxy reaches vikunja by service name.)

  # --- lastglance ---
  lastglance:
    image: ghcr.io/krelltunez/lastglance:${LASTGLANCE_IMAGE_TAG:-2.14.0}
    container_name: allglance-lastglance
    restart: unless-stopped
    ports:
      - "3000:80"

  # --- lifeGLANCE ---
  lifeglance:
    image: ghcr.io/krelltunez/lifeglance:${LIFEGLANCE_IMAGE_TAG:-3.6.0}
    container_name: allglance-lifeglance
    restart: unless-stopped
    ports:
      - "6868:80"

  # --- AllGLANCE: ONE container with everything of ours -------------------------
  # Three supervised processes (see gateway/supervisor.mjs):
  #   gateway        :8090  the single front door: MCP + REST + CalDAV (/dav)
  #   dayglance-mcp  (loopback only)  dayGLANCE's data over MCP, plus the intent-event fixer
  #   sync           :6065 (published as 8091)  the WebDAV server the GLANCE apps sync to
  # The apps sync their data (and intents) to the WebDAV server; the MCP and the
  # gateway read and write those same files from the same /sync directory, so the
  # gateway always sees live app data and changes made through MCP flow back into
  # the apps on their next sync.
  #
  # In every dayGLANCE / lastGLANCE / lifeGLANCE set Cloud Sync -> WebDAV:
  #   URL http://<this-host>:8091   (web builds in this stack: http://allglance:6065,
  #   which their built-in proxies reach by service name), the user/password below,
  #   Sync folder "dayglance" for dayGLANCE. End-to-end encryption can stay ON:
  #   set GLANCE_SYNC_PASSPHRASE (the same passphrase typed into the apps).
  allglance:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: allglance/allglance:latest
    container_name: allglance
    restart: unless-stopped
    user: "99:100"                 # nobody:users on Unraid; owns the data dirs below
    ports:
      - "8090:8090"                # gateway: MCP, REST, CalDAV
      - "8091:6065"                # WebDAV sync server (for the apps on your devices)
    networks:
      default:
        aliases:
          - dayglance-sync         # the name earlier docs/app settings used for the WebDAV server
    env_file:
      - ./.env.allglance        # create this (scripts/setup.sh does); see README.md
    environment:
      - DAYGLANCE_SYNC_USER=${DAYGLANCE_SYNC_USER:-glance}
      - DAYGLANCE_SYNC_PASSWORD=${DAYGLANCE_SYNC_PASSWORD:?set DAYGLANCE_SYNC_PASSWORD in .env.allglance}
      # The gateway reaches the MCP over loopback (it is not published).
      - DAYGLANCE_MCP_HOST=127.0.0.1
      - DAYGLANCE_MCP_PORT=7893
      - DAYGLANCE_MCP_TOKEN=${DAYGLANCE_MCP_TOKEN:-}
      # State source for the MCP and the gateway: the app's own sync snapshot, and
      # the other apps' snapshots, all in /sync. Same passphrase as the apps.
      - GLANCE_SYNC_DIR=/sync
      - DAYGLANCE_SYNC_FILE=/sync/${DAYGLANCE_SYNC_FOLDER:-dayglance}/dayglance-sync.json
      - GLANCE_SYNC_PASSPHRASE=${GLANCE_SYNC_PASSPHRASE:-}
      - DAYGLANCE_SYNC_PASSPHRASE=${GLANCE_SYNC_PASSPHRASE:-}
      # Keeps intent event files readable across the GLANCE apps (dayGLANCE names
      # completion events with a UUID that lastGLANCE's poller ignores).
      - DAYGLANCE_EVENTS_ROOT=/sync
      - TZ=${TZ:-UTC}
    depends_on:
      vikunja:
        condition: service_healthy
    volumes:
      - ${ALLGLANCE_DATA:-/mnt/user/appdata/allglance-data}/dayglance-sync:/sync   # WebDAV root: app snapshots + intents
      - ${ALLGLANCE_DATA:-/mnt/user/appdata/allglance-data}/gateway:/data          # roster cache

# The gateway talks to Vikunja by its service name (matches gateway/src/config.js).
networks:
  default:
    name: allglance-net
